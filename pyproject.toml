[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "excavation-sim"
version = "0.1.0.dev0"
description = "A reproducible testbed for excavation and terrain interaction research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
physics = ["newton==1.6.0"]
data = ["numpy==2.5.3"]
plots = ["matplotlib==3.11.2"]
dev = ["pytest==9.1.1", "ruff==0.16.8", "build==1.6.1", "numpy==2.5.3", "setuptools==84.0.0"]

[project.scripts]
excavation-sim = "excavation_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: requires an explicitly requested CUDA integration run"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
excavation_sim = ["inspection.html", "live.js"]
